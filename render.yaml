services:
  - type: web
    name: wayku-runner-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./src/WaykuRunner.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__WaykuRunner
        sync: false
      - key: Admin__BootstrapKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false